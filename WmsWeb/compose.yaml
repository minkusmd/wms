# WmsWeb - mediul de DEZVOLTARE: PHP 8.5-FPM + Laravel 13 + drivere Firebird.
#   docker compose up -d --build                      -> http://localhost:8090 + baza Firebird 5 de test
#   docker compose exec app php artisan firebird:check  -> verifica pdo_firebird, ibase_* si Eloquent
#   docker compose exec app composer ...              -> Composer ruleaza doar in container
#
# Variabilele (parole, gazda Firebird) vin din .env (nu e in git). Vezi .env.example.
# Containerele NU primesc variabilele de mediu Windows decat daca sunt declarate aici.

name: wmsweb

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    image: wmsweb-app:dev
    volumes:
      - ./:/var/www/html
    environment:
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
    depends_on:
      firebird-test:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.29-alpine
    ports:
      - "${WEB_PORT:-8090}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # Baza Firebird 5 de TEST, goala (fara legatura cu SW). Pentru SW: FB_HOST/FB_DATABASE in .env.
  firebird-test:
    image: firebirdsql/firebird:5.0.4
    environment:
      # Atentie: NU folosi aici numele FIREBIRD_PASSWORD din mediul Windows -
      # acolo e parola SW pentru MCP, iar compose ar prefera-o fata de .env.
      FIREBIRD_ROOT_PASSWORD: ${FB_TEST_SYSDBA_PASSWORD:?seteaza FB_TEST_SYSDBA_PASSWORD in .env}
      FIREBIRD_DATABASE: wmsweb_test.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
      FIREBIRD_CONF_WireCrypt: Enabled
      TZ: Europe/Chisinau
    volumes:
      - firebird-test-data:/var/lib/firebird/data
    ports:
      # doar pe localhost, pentru isql/IBExpert din Windows
      - "127.0.0.1:${FB_TEST_PORT:-3052}:3050"
    healthcheck:
      test: ["CMD-SHELL", "echo 'select 1 from rdb$$database;' | isql -q -user SYSDBA -password \"$$FIREBIRD_ROOT_PASSWORD\" localhost:/var/lib/firebird/data/wmsweb_test.fdb >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  firebird-test-data:
