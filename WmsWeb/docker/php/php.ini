; Setari PHP pentru WmsWeb (dezvoltare)
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 64M
max_execution_time = 60
expose_php = Off
date.timezone = Europe/Chisinau

opcache.enable = 1
opcache.max_accelerated_files = 20000
; Codul e montat din Windows: verificarea timestamp-urilor face fiecare request lent.
; Implicit 1 (modificarile se vad imediat); pentru viteza PHP_OPCACHE_VALIDATE_TIMESTAMPS=0 in .env,
; iar dupa o modificare de cod: docker compose exec app sh -c "kill -USR2 1"
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
opcache.revalidate_freq = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
