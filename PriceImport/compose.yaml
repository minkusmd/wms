name: priceimport

services:
  pi-worker:
    build: .
    image: priceimport:0.3
    restart: unless-stopped
    env_file: .env
    environment:
      PI_FB_PASSWORD_FILE: /run/secrets/fb_password
    secrets:
      - fb_password
    volumes:
      - ./data:/app/data
    # un singur proces: indexul UX_TPI_RUN_ACTIVE apara oricum de rulari suprapuse
    deploy:
      replicas: 1

  # botul Telegram al furnizorilor manuali: bot SEPARAT de cel al SWNService (getUpdates are un singur consumator)
  pi-bot:
    image: priceimport:0.3
    restart: unless-stopped
    command: ["pi", "bot"]
    env_file: .env
    environment:
      PI_FB_PASSWORD_FILE: /run/secrets/fb_password
      PI_BOT_TOKEN_FILE: /run/secrets/bot_token
    secrets:
      - fb_password
      - bot_token
    volumes:
      - ./data:/app/data
    healthcheck:
      disable: true
    depends_on:
      - pi-worker

secrets:
  fb_password:
    file: ./secrets/fb_password.txt
  bot_token:
    file: ./secrets/bot_token.txt
