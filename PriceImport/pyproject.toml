[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "priceimport"
version = "0.2.0"
description = "Import automat de pricelisturi pentru WMS (Firebird 5): diff, praguri, raport Telegram"
requires-python = ">=3.12"
dependencies = [
  "firebird-driver>=2.0",
  "httpx>=0.28",
  "tenacity>=9",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "PyYAML>=6",
  "APScheduler>=3.11,<4",
  "structlog>=25",
  "typer>=0.15",
  "Jinja2>=3.1",
  "xlsxwriter>=3.2",
  "zstandard>=0.23",
  "python-calamine>=0.3",
  "openpyxl>=3.1",
  "rapidfuzz>=3.10",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.22"]

[project.scripts]
pi = "priceimport.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["integration: are nevoie de Firebird 5 local (embedded)"]
