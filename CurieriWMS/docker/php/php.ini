; Setari PHP pentru CurieriWMS (fotografii de pe telefon -> limite de upload mai mari)
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 64M
max_file_uploads = 30
max_execution_time = 60
expose_php = Off
date.timezone = Europe/Chisinau

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
