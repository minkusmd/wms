# CurieriWMS - mediul de DEZVOLTARE.
#   docker compose up -d --build                 -> web http://localhost:8080 + baza de test
#   docker compose --profile vite up -d vite     -> Vite cu reincarcare (optional)
#   docker compose exec app php artisan curieri:verifica-firebird --scriere
#
# Variabilele (parole, gazda Firebird) vin din .env (nu e in git). Vezi .env.example.
# Containerele NU primesc variabilele de mediu Windows decat daca sunt declarate aici.

name: curieriwms

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    image: curieriwms-app:dev
    volumes:
      - ./:/var/www/html
    # conexiunea Firebird vine din .env (FB_*); pentru alta baza:
    #   docker compose exec -e FB_HOST=... -e FB_DATABASE=... app php artisan ...
    depends_on:
      firebird-test:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.29-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # Baza Firebird 5 de TEST (stub-uri WMS + DB Model/supplier_pickup.sql + DB Model/dispatch_logistics.sql + date fictive).
  # Nu are legatura cu SW: aici se pot rula verificarile care scriu (cu rollback).
  firebird-test:
    image: firebirdsql/firebird:5.0.4
    environment:
      # Atentie: NU folosi aici numele FIREBIRD_PASSWORD din mediul Windows -
      # acolo e parola SW pentru MCP, iar compose ar prefera-o fata de .env.
      FIREBIRD_ROOT_PASSWORD: ${FB_TEST_SYSDBA_PASSWORD:?seteaza FB_TEST_SYSDBA_PASSWORD in .env}
      FIREBIRD_USER: ${FB_TEST_USER:-CURIERI}
      FIREBIRD_PASSWORD: ${FB_TEST_PASSWORD:?seteaza FB_TEST_PASSWORD in .env}
      FIREBIRD_DATABASE: curieri_test.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
      FIREBIRD_CONF_WireCrypt: Enabled
      # ca serverul SW: CURRENT_TIMESTAMP in ora Moldovei
      TZ: Europe/Chisinau
    volumes:
      - firebird-test-data:/var/lib/firebird/data
      - ./docker/firebird-test/init/10-stubs.sql:/docker-entrypoint-initdb.d/10-stubs.sql:ro
      - ../DB Model/supplier_pickup.sql:/docker-entrypoint-initdb.d/20-supplier_pickup.sql:ro
      - ../DB Model/dispatch_logistics.sql:/docker-entrypoint-initdb.d/25-dispatch_logistics.sql:ro
      - ./docker/firebird-test/init/30-seed.sql:/docker-entrypoint-initdb.d/30-seed.sql:ro
      - ./docker/firebird-test/init/90-probe.sql:/docker-entrypoint-initdb.d/90-probe.sql:ro
    ports:
      # doar pe localhost, pentru isql/IBExpert din Windows
      - "127.0.0.1:${FB_TEST_PORT:-3051}:3050"
    healthcheck:
      test: ["CMD-SHELL", "echo 'select 1 from rdb$$database;' | isql -q -user SYSDBA -password \"$$FIREBIRD_ROOT_PASSWORD\" localhost:/var/lib/firebird/data/curieri_test.fdb >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  vite:
    image: node:24-alpine
    profiles: ["vite"]
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app

volumes:
  firebird-test-data:
